[project]
name = "shabbos-goy"
version = "0.9.1"
description = "Hebrew-speaking speech-to-speech agent that helps observant Jews on Shabbat and Yom Kippur without breaking them: it never takes direct commands, only infers intent from indirect remarks (e.g. 'I wish it was cold' -> turn on the AC)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [{name = "AgentCulture"}]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Topic :: Software Development",
    "Intended Audience :: Developers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/agentculture/shabbos-goy"
Issues = "https://github.com/agentculture/shabbos-goy/issues"

[project.scripts]
shabbos-goy = "shabbos_goy.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shabbos_goy"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-cov>=4.1",
    "bandit>=1.7.5",
    "flake8>=6.1",
    "isort>=5.12.0",
    "black>=23.7.0",
    "teken>=0.8",
    "pyyaml>=6.0",
]

[tool.coverage.run]
source = ["shabbos_goy"]
omit = ["shabbos_goy/__pycache__/*"]
# Emit repo-relative paths in coverage.xml so SonarCloud maps them to
# sonar.sources=shabbos_goy (absolute/.venv paths fail to map → empty coverage).
relative_files = true

[tool.coverage.report]
fail_under = 60
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["shabbos_goy"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101", "B404", "B603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The golden set's LIVE run needs the box (a real lobes gateway + the senses
# model), so it is never part of the default suite or of CI: -m "not golden"
# deselects it here, while `pytest -m golden` (a command-line -m overrides
# addopts) selects it — where it still skips with a named reason unless the
# environment points at a real gateway. See tests/golden/README.md (d4).
addopts = "-ra -m \"not golden\""
markers = [
    "golden: the live golden-set run against the real model on the box; excluded from the default run and from CI",
]
